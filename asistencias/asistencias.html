<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>King Web | Herramienta de Asistencias</title>

<link rel="icon" type="image/png" href="../imagenes/logo2.png">
<link rel="stylesheet" href="asistencias.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

</head>

<body>

<header class="topbar">
<div class="top-left">
<img src="../imagenes/logo2.png" class="top-logo">
<div>
<div class="top-title">Herramienta de Asistencias</div>
<div class="top-sub">Visitante-KingWeb</div>
</div>
</div>

<div style="display:flex;gap:10px;">
<button onclick="location.href='admin.html'" class="btn-logout">Panel</button>
<button onclick="location.href='../index.html'" class="btn-logout">Inicio</button>
</div>
</header>

<main class="main">

<section id="viewRegistro" class="view active">

<div class="card">

<div class="card-title">Registro</div>
<div class="muted" id="txtEstado">Detecta tu ubicación</div>

<div class="grid">

<div class="mini">
<div class="mini-label">Distancia</div>
<div id="txtDistancia" class="mini-value">---</div>
</div>

<div class="mini">
<div class="mini-label">Acceso</div>
<div id="txtAcceso" class="badge badge-no">Bloqueado</div>
</div>

<div class="mini">
<div class="mini-label">Precisión</div>
<div id="txtPrecision" class="mini-value">---</div>
</div>

</div>

<div class="card2">

<div class="card2-title">Hoy</div>

<div class="today-grid">

<div class="today-item">
<div class="today-label">Entrada</div>
<div id="txtEntradaHoy" class="today-value">---</div>
</div>

<div class="today-item">
<div class="today-label">Salida</div>
<div id="txtSalidaHoy" class="today-value">---</div>
</div>

<div class="today-item full">
<div class="today-label">Tiempo trabajado</div>
<div id="txtTiempoHoy" class="today-value big">---</div>
</div>

</div>
</div>

<div class="actions">
<button id="btnUbicacion" class="btn btn-secondary">📡 Informar ubicación</button>
</div>

<div class="actions">
<button id="btnEntrada" class="btn btn-primary">🟢 Registrar entrada</button>
<button id="btnSalida" class="btn btn-outline">🔴 Registrar salida</button>
</div>

<div id="msgRegistro" class="msg"></div>

</div>

<div class="card">
<div class="card-title">Mapa</div>
<div class="mapbox">
<div id="map" class="map"></div>
</div>
</div>

</section>

<section id="viewHistorial" class="view">

<div class="card">
<div class="card-title">Historial</div>
<div class="muted">Registros recientes</div>

<div class="filters">
<button id="btnRefrescarHistorial" class="btn btn-secondary small">Actualizar</button>
</div>

<div id="historialList" class="list"></div>

</div>

</section>

</main>

<nav class="tabbar">

<button class="tab active" data-view="viewRegistro">
<div class="tab-ico">📍</div>
<div class="tab-txt">Registro</div>
</button>

<button class="tab" data-view="viewHistorial">
<div class="tab-ico">🕒</div>
<div class="tab-txt">Historial</div>
</button>

</nav>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="asistencias.js"></script>

</body>
</html>
