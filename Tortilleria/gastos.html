<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Gastos – Tortillería</title>

<link rel="icon" href="../imagenes/logo2.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Poppins;
background:#f1f5f9;
}

header{
background:#dc2626;
color:white;
padding:12px 16px;
display:flex;
justify-content:space-between;
align-items:center;
}

header img{height:36px}

.btn{
background:#0ea5e9;
border:none;
color:white;
padding:8px 16px;
border-radius:20px;
font-weight:600;
cursor:pointer;
}

.container{
padding:20px;
max-width:700px;
margin:auto;
}

.card{
background:white;
padding:20px;
border-radius:18px;
box-shadow:0 6px 18px rgba(0,0,0,.1);
margin-bottom:20px;
}

input,select{
width:100%;
padding:10px;
margin:6px 0 12px;
border-radius:10px;
border:1px solid #ddd;
}

.primary{
background:#22c55e;
border:none;
color:white;
width:100%;
padding:12px;
border-radius:25px;
font-weight:600;
cursor:pointer;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#7f1d1d;
color:white;
padding:8px;
font-size:13px;
}

td{
padding:8px;
font-size:13px;
border-bottom:1px solid #eee;
text-align:center;
}

.del{
background:#ef4444;
border:none;
color:white;
padding:5px 10px;
border-radius:10px;
cursor:pointer;
}

</style>
</head>

<body>

<header>
<div style="display:flex;align-items:center;gap:10px">
<img src="../imagenes/logo2.png">
<b>Gastos</b>
</div>

<button class="btn" onclick="location.href='tortilleria.html'">Volver</button>
</header>

<div class="container">

<div class="card">

<select id="categoria">
<option value="">Categoría</option>
<option>Insumos</option>
<option>Luz</option>
<option>Agua</option>
<option>Gas</option>
<option>Mantenimiento</option>
<option>Otros</option>
</select>

<input id="concepto" placeholder="Concepto del gasto">
<input id="monto" type="number" placeholder="Monto">

<button class="primary" onclick="guardar()">Registrar gasto</button>

</div>

<div class="card">

<table>
<thead>
<tr>
<th>Categoría</th>
<th>Concepto</th>
<th>Monto</th>
<th></th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

</div>

</div>

<script type="module" src="gastos.js"></script>

</body>
</html>
