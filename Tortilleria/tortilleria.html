<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Herramienta para Tortillerías</title>

<link rel="icon" href="../imagenes/logo2.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Poppins;
background:#f1f5f9;
}

header{
background:linear-gradient(135deg,#16a34a,#22c55e);
color:white;
padding:14px 18px;
display:flex;
justify-content:space-between;
align-items:center;
}

header img{height:38px}

.btn{
background:#0ea5e9;
border:none;
color:white;
padding:8px 16px;
border-radius:20px;
font-weight:600;
cursor:pointer;
transition:.25s;
}

.btn:hover{transform:scale(1.05)}

.container{
padding:20px;
max-width:1000px;
margin:auto;
}

.saludo{
font-size:15px;
margin-bottom:15px;
color:#334155;
}

.resumen{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:15px;
margin-bottom:25px;
}

.card{
background:white;
padding:15px;
border-radius:16px;
box-shadow:0 4px 12px rgba(0,0,0,.08);
text-align:center;
}

.card h3{
margin:0;
font-size:13px;
color:#64748b;
}

.card .valor{
font-size:20px;
font-weight:600;
margin-top:6px;
color:#16a34a;
}

.menu{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:18px;
}

.modulo{
background:white;
border-radius:18px;
padding:20px;
text-align:center;
cursor:pointer;
box-shadow:0 6px 18px rgba(0,0,0,.1);
transition:.25s;
}

.modulo:hover{
transform:translateY(-6px);
}

.ico{
font-size:36px;
margin-bottom:10px;
}

.modulo b{
display:block;
margin-bottom:6px;
}

footer{
margin-top:30px;
text-align:center;
font-size:12px;
color:#64748b;
}

@media(max-width:600px){
header{
flex-direction:column;
gap:8px;
}
}

</style>
</head>

<body>

<header>
<div style="display:flex;align-items:center;gap:10px">
<img src="../imagenes/logo2.png">
<b>Herramienta para Tortillerías</b>
</div>

<button class="btn" onclick="location.href='../index.html'">Inicio</button>
</header>

<div class="container">

<div class="saludo">
Bienvenido <b>Visitante-KingWeb</b> 👋
</div>

<div class="resumen">

<div class="card">
<h3>Ventas Hoy</h3>
<div class="valor" id="stVentas">$0.00</div>
</div>

<div class="card">
<h3>Gastos</h3>
<div class="valor" id="stGastos">$0.00</div>
</div>

<div class="card">
<h3>Ganancia</h3>
<div class="valor" id="stGanancia">$0.00</div>
</div>

</div>

<div class="menu">

<div class="modulo" onclick="location.href='ventas.html'">
<div class="ico">🧾</div>
<b>Ventas</b>
Registro de ventas y recibos
</div>

<div class="modulo" onclick="location.href='empleados.html'">
<div class="ico">👷</div>
<b>Empleados</b>
Gestión de personal
</div>

<div class="modulo" onclick="location.href='gastos.html'">
<div class="ico">💸</div>
<b>Gastos</b>
Control de egresos
</div>

<div class="modulo" onclick="location.href='ganancias.html'">
<div class="ico">📊</div>
<b>Ganancias</b>
Resumen financiero
</div>

</div>

<footer>
King Web · Demo Tortillería · 2026
</footer>

</div>

<script type="module" src="tortilleria.js"></script>

</body>
</html>
