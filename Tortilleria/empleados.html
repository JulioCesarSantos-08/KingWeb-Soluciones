<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Empleados – Tortillería</title>

<link rel="icon" href="../imagenes/logo2.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Poppins;
background:#f1f5f9;
}

header{
background:#0284c7;
color:white;
padding:12px 16px;
display:flex;
justify-content:space-between;
align-items:center;
}

header img{height:36px}

.btn{
background:#0ea5e9;
border:none;
color:white;
padding:8px 16px;
border-radius:20px;
font-weight:600;
cursor:pointer;
}

.container{
padding:20px;
max-width:700px;
margin:auto;
}

.card{
background:white;
padding:20px;
border-radius:18px;
box-shadow:0 6px 18px rgba(0,0,0,.1);
margin-bottom:20px;
}

input{
width:100%;
padding:10px;
margin:6px 0 12px;
border-radius:10px;
border:1px solid #ddd;
}

.primary{
background:#22c55e;
border:none;
color:white;
width:100%;
padding:12px;
border-radius:25px;
font-weight:600;
cursor:pointer;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#1e40af;
color:white;
padding:8px;
font-size:13px;
}

td{
padding:8px;
font-size:13px;
border-bottom:1px solid #eee;
text-align:center;
}

.del{
background:#ef4444;
border:none;
color:white;
padding:5px 10px;
border-radius:10px;
cursor:pointer;
}

</style>
</head>

<body>

<header>
<div style="display:flex;align-items:center;gap:10px">
<img src="../imagenes/logo2.png">
<b>Empleados</b>
</div>

<button class="btn" onclick="location.href='tortilleria.html'">Volver</button>
</header>

<div class="container">

<div class="card">

<input id="nombre" placeholder="Nombre del empleado">
<input id="puesto" placeholder="Puesto">
<input id="sueldo" type="number" placeholder="Sueldo">

<button class="primary" onclick="guardar()">Agregar empleado</button>

</div>

<div class="card">

<table>
<thead>
<tr>
<th>Nombre</th>
<th>Puesto</th>
<th>Sueldo</th>
<th></th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

</div>

</div>

<script type="module" src="empleados.js"></script>

</body>
</html>
