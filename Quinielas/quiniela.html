<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demo Quiniela</title>
<link rel="icon" href="../imagenes/logo2.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

<style>
body{margin:0;font-family:Poppins;background:#eef3ff}
header{
background:#2563eb;color:white;padding:12px 15px;
display:flex;align-items:center;justify-content:space-between
}
header img{height:38px}

main{padding:15px;max-width:520px;margin:auto}

.partido{
background:white;border-radius:14px;padding:12px;margin-bottom:12px;
display:flex;align-items:center;justify-content:space-between;
box-shadow:0 4px 15px rgba(0,0,0,.08);transition:.25s
}
.partido:hover{transform:scale(1.02)}
.partido img{height:38px}

select{
padding:8px 10px;border-radius:10px;border:1px solid #ccc;font-weight:bold
}

.botones{display:grid;gap:10px;margin-top:20px}

.btn{
padding:12px;border:none;border-radius:25px;font-weight:bold;color:white;
cursor:pointer;transition:.3s
}
.enviar{background:#22c55e}
.enviar:hover{background:#16a34a}
.tabla{background:#2563eb}
.tabla:hover{background:#1e40af}
.inicio{background:#0ea5e9}
.inicio:hover{background:#0284c7}

</style>
</head>

<body>

<header>
<div style="display:flex;align-items:center;gap:10px">
<img src="../imagenes/logo2.png">
<b>Demo Quiniela</b>
</div>

<div style="display:flex;gap:8px">
<button class="btn inicio" onclick="location.href='../index.html'">Inicio</button>
<button class="btn tabla" onclick="location.href='tabla.html'">Tabla</button>
</div>
</header>

<main id="lista"></main>

<div class="botones">
<button class="btn enviar" onclick="enviar()">Enviar quiniela</button>
</div>

<script type="module" src="quiniela.js"></script>
</body>
</html>
