<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Herramienta para tienda en línea</title>

<link rel="icon" href="../imagenes/logo2.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>

*{box-sizing:border-box}

body{
margin:0;
font-family:Poppins;
background:#eef3ff;
padding-bottom:140px;
}

header{
background:#2563eb;
color:white;
padding:12px 16px;
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
flex-wrap:wrap;
}

header img{height:36px}

.btn{
background:#0ea5e9;
border:none;
color:white;
padding:8px 16px;
border-radius:20px;
font-weight:600;
cursor:pointer;
transition:.25s;
}

.btn:hover{transform:scale(1.05)}

.btn.green{background:#22c55e}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:15px;
padding:20px;
}

.card{
background:white;
border-radius:16px;
padding:12px;
box-shadow:0 4px 12px rgba(0,0,0,.08);
text-align:center;
display:flex;
flex-direction:column;
gap:5px;
}

.card img{
width:100%;
height:120px;
object-fit:contain;
}

.nombre{font-weight:600}
.desc{font-size:12px;color:#666}

.precioOld{text-decoration:line-through;color:#888;font-size:12px}
.precioNew{font-weight:600;color:#16a34a}

.badge{
background:#dc2626;
color:white;
font-size:11px;
padding:3px 8px;
border-radius:10px;
display:inline-block;
}

.carrito{
position:fixed;
bottom:0;
left:0;
right:0;
background:white;
box-shadow:0 -4px 12px rgba(0,0,0,.15);
padding:10px 15px;
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
z-index:50;
}

#listaCarrito{
font-size:12px;
max-height:50px;
overflow:auto;
flex:1;
}

.total{font-weight:600}

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.6);
display:none;
align-items:center;
justify-content:center;
z-index:100;
}

.ticket{
background:white;
width:320px;
padding:20px;
border-radius:14px;
text-align:center;
font-size:14px;
}

.ticket h2{margin:0}

.ticket hr{margin:10px 0}

.sub{color:#666;font-size:12px}

.btn-primary{
background:#22c55e;
border:none;
color:white;
padding:10px;
width:100%;
border-radius:10px;
margin-top:10px;
font-weight:600;
}

.btn-outline{
margin-top:6px;
background:none;
border:1px solid #ccc;
width:100%;
padding:8px;
border-radius:10px;
}

</style>
</head>

<body>

<header>
<div style="display:flex;align-items:center;gap:10px">
<img src="../imagenes/logo2.png">
<b>Herramienta para tienda en línea</b>
</div>

<div style="display:flex;gap:8px">
<button class="btn" onclick="location.href='recibos.html'">Recibos</button>
<button class="btn" onclick="location.href='../index.html'">Inicio</button>
</div>
</header>

<div class="grid" id="productos"></div>

<div class="carrito">
<div id="listaCarrito"></div>
<div class="total" id="total">$0</div>
<button class="btn green" onclick="comprar()">Comprar</button>
</div>

<div id="modal" class="modal">
<div class="ticket">

<h2>King Web Store</h2>
<div class="sub">Gracias por visitarnos</div>

<div id="ticketItems"></div>

<hr>

<div id="ticketTotales"></div>

<div class="sub">Cliente: Visitante-KingWeb</div>

<button onclick="confirmarCompra()" class="btn-primary">Confirmar compra</button>
<button onclick="cerrarModal()" class="btn-outline">Cancelar</button>

</div>
</div>

<script type="module" src="productos.js"></script>

</body>
</html>
